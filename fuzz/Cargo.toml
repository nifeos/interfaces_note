# The cargo-fuzz targets, in a workspace of their own so that `cargo build` and `cargo test` at the
# root never build them. They need nightly: `cargo +nightly fuzz run <target>`.

[package]
name = "interfaces_note-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.interfaces_note]
path = ".."

[[bin]]
name = "interfaces_decode"
path = "fuzz_targets/interfaces_decode.rs"
test = false
doc = false
bench = false

[workspace]
